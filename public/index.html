<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokémon Partner Finder</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Pokémon Companion Match</p>
          <h1>Find Your Perfect Partner</h1>
        </div>
      </header>

      <main class="layout">
        <section class="panel form-panel">
          <h2>Build your battle profile</h2>

          <form id="partner-form">
            <div class="field-group">
              <label for="trainerName">Trainer name</label>
              <input id="trainerName" name="trainerName" type="text" placeholder="Ash" value="Ash" />
            </div>

            <div class="field-grid two-up">
              <div class="field-group">
                <label for="battleStyle">Battle style</label>
                <select id="battleStyle" name="battleStyle">
                  <option value="offense">Offense</option>
                  <option value="defense">Defense</option>
                  <option value="balance" selected>Balanced</option>
                  <option value="support">Support</option>
                </select>
              </div>

              <div class="field-group">
                <label for="teamRole">Ideal team role</label>
                <select id="teamRole" name="teamRole">
                  <option value="tank">Tank</option>
                  <option value="striker">Striker</option>
                  <option value="support" selected>Support</option>
                </select>
              </div>
            </div>

            <div class="field-grid two-up">
              <div class="field-group">
                <label for="preferredType">Favorite type</label>
                <select id="preferredType" name="preferredType">
                  <option value="Any" selected>Any type</option>
                  <option value="Normal">Normal</option>
                  <option value="Fire">Fire</option>
                  <option value="Water">Water</option>
                  <option value="Grass">Grass</option>
                  <option value="Electric">Electric</option>
                  <option value="Ice">Ice</option>
                  <option value="Fighting">Fighting</option>
                  <option value="Poison">Poison</option>
                  <option value="Ground">Ground</option>
                  <option value="Flying">Flying</option>
                  <option value="Psychic">Psychic</option>
                  <option value="Bug">Bug</option>
                  <option value="Rock">Rock</option>
                  <option value="Ghost">Ghost</option>
                  <option value="Dragon">Dragon</option>
                  <option value="Dark">Dark</option>
                  <option value="Steel">Steel</option>
                  <option value="Fairy">Fairy</option>
                </select>
              </div>

              <div class="field-group">
                <label for="preferredColor">Favorite color</label>
                <select id="preferredColor" name="preferredColor">
                  <option value="Any" selected>Any color</option>
                  <option value="Red">Red</option>
                  <option value="Blue">Blue</option>
                  <option value="Yellow">Yellow</option>
                  <option value="Green">Green</option>
                  <option value="Purple">Purple</option>
                  <option value="Pink">Pink</option>
                  <option value="Orange">Orange</option>
                  <option value="Black">Black</option>
                  <option value="White">White</option>
                  <option value="Brown">Brown</option>
                  <option value="Gold">Gold</option>
                  <option value="Grey">Grey</option>
                  <option value="Tan">Tan</option>
                </select>
              </div>
            </div>

            <div class="field-grid two-up">
              <div class="field-group">
                <label for="favoriteStat">Favorite stat</label>
                <select id="favoriteStat" name="favoriteStat">
                  <option value="Any" selected>No preference</option>
                  <option value="Attack">Attack</option>
                  <option value="Defense">Defense</option>
                  <option value="Speed">Speed</option>
                  <option value="Special">Special</option>
                  <option value="Stamina">Stamina</option>
                </select>
              </div>

              <div class="field-group">
                <label for="generation">Generation</label>
                <select id="generation" name="generation">
                  <option value="Any" selected>Any generation</option>
                  <option value="1">Generation 1</option>
                  <option value="2">Generation 2</option>
                  <option value="3">Generation 3</option>
                  <option value="4">Generation 4</option>
                  <option value="5">Generation 5</option>
                  <option value="6">Generation 6</option>
                  <option value="7">Generation 7</option>
                  <option value="8">Generation 8</option>
                  <option value="9">Generation 9</option>
                </select>
              </div>
            </div>

            <button type="submit" class="primary-btn">Choose my partner</button>
          </form>
        </section>

        <section class="panel result-panel">
          <h2>Recommended partner</h2>
          <div id="result-card" class="result-card empty">
            <p>Submit your preferences to discover your battle partner.</p>
          </div>

          <div class="mini-list">
            <h3>Top alternatives</h3>
            <ul id="alternative-list">
              <li>Waiting for a match...</li>
            </ul>
          </div>
        </section>
      </main>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
